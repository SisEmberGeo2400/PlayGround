<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Crumb & Chaos</title>
<style>
:root{--ink:#171321;--cream:#fff6dc;--pink:#ff6b9e;--yellow:#ffd45c;--cyan:#65d8df;--purple:#8a70ca}
*{box-sizing:border-box}body{margin:0;background:#151122;color:var(--cream);font-family:Trebuchet MS,Arial,sans-serif;overflow:hidden}.hidden{display:none!important}
#app{height:100dvh;display:grid;grid-template-columns:220px minmax(320px,1fr) 290px}.panel{background:#211936;border-right:3px solid #372b50;padding:14px;overflow:auto}#right{border-right:0;border-left:3px solid #372b50}
.logo{font-size:25px;font-weight:1000;color:var(--yellow);text-shadow:3px 3px 0 #df5c79}.sub{font-size:11px;color:#bdb1d8;letter-spacing:2px}.char-list{display:grid;gap:8px;margin-top:18px}.char-card{height:68px;border:2px solid #493a66;border-radius:12px;padding:8px;display:flex;align-items:center;gap:9px;background:#2b2244;cursor:pointer}.char-card.active{border-color:var(--yellow);box-shadow:0 0 15px #ffd45c55}.portrait{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:27px;background:#5b477c;flex:none}.cname{font-weight:900;font-size:14px}.role{font-size:10px;color:#c5bada}
nav{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:16px}button{border:0;border-radius:9px;padding:9px 8px;font-weight:900;color:#21152c;background:var(--yellow);cursor:pointer}button:hover{filter:brightness(1.08);transform:translateY(-1px)}button:active{transform:translateY(1px)}.ghost{background:#46375f;color:#eee}.danger{background:#f16d78}.green{background:#79d89b}
#game{position:relative;background:#2c5b45;overflow:hidden}.arena{height:100%;position:relative;background:radial-gradient(circle at 50% 45%,#376d54 0 38%,#244936 39% 100%);overflow:hidden}.arena:before{content:"";position:absolute;inset:0;opacity:.12;background-image:linear-gradient(45deg,#fff 25%,transparent 25%),linear-gradient(-45deg,#fff 25%,transparent 25%);background-size:44px 44px}
.hud{position:absolute;z-index:5;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start}.hud-box{background:#171321cc;border:2px solid #6a5686;border-radius:10px;padding:8px 10px}.bar{width:160px;height:12px;background:#532d3c;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#ef6a79}.meta{display:flex;gap:7px}.coin{color:var(--yellow)}
#player{position:absolute;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:35px;z-index:3;filter:drop-shadow(0 5px 2px #0005);transition:transform .08s}.enemy{position:absolute;width:48px;height:48px;border-radius:13px;display:grid;place-items:center;font-size:29px;z-index:2;filter:drop-shadow(0 4px 2px #0005)}.boss{width:80px;height:80px;border-radius:20px;font-size:48px;border:4px solid #ff9a70}.projectile{position:absolute;width:12px;height:12px;border-radius:50%;background:#ff8b61;z-index:4}.gem{position:absolute;width:18px;height:18px;transform:rotate(45deg);border:3px solid #fff;background:#66dbd6}.loot{position:absolute;font-size:18px;z-index:4}.damage{position:absolute;color:#fff;font-weight:1000;text-shadow:2px 2px #b92744;z-index:6;animation:float .7s forwards}@keyframes float{to{transform:translateY(-35px);opacity:0}}
.wave{position:absolute;left:50%;top:18%;transform:translateX(-50%);z-index:8;text-align:center;font-size:28px;font-weight:1000;text-shadow:3px 3px #000;pointer-events:none}.wave small{display:block;font-size:12px;color:#ffd45c}
#chatHead{font-weight:1000;border-bottom:2px solid #493a66;padding-bottom:10px}.tabs{display:flex;gap:5px;margin:10px 0}.tabs button{padding:7px 6px;font-size:11px}.messages{height:calc(100% - 145px);overflow:auto;display:flex;flex-direction:column;gap:8px}.msg{background:#342947;border-radius:10px;padding:8px;font-size:12px}.msg b{color:var(--yellow)}.me{background:#46515c;align-self:flex-end}.chat-input{display:flex;gap:5px;position:absolute;bottom:14px;left:14px;right:14px}.chat-input input{min-width:0;flex:1;border-radius:8px;border:2px solid #5b4c78;background:#171321;color:white;padding:9px}
.overlay{position:absolute;z-index:20;inset:0;background:#171321dd;display:grid;place-items:center}.modal{width:min(520px,calc(100% - 28px));max-height:85vh;overflow:auto;background:#302445;border:3px solid #66547e;border-radius:16px;padding:18px}.modal h2{margin:0 0 8px;color:var(--yellow)}.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.item{border:2px solid #57466d;border-radius:10px;background:#241c35;padding:9px}.item b{display:block}.tutorial-step{display:flex;gap:10px;margin:10px 0}.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--pink);font-weight:bold}.dead-pan{font-size:100px;text-align:center}.dead-egg{font-size:55px;position:absolute;top:44%;left:50%;transform:translate(-50%,-50%)}
#minigame{position:absolute;z-index:15;inset:0;background:#171321e8}.drop-food{position:absolute;font-size:42px}.dumpster{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:74px;cursor:grab}.coffee{position:absolute;top:12px;right:40px;font-size:58px}.mini-hud{position:absolute;z-index:2;left:12px;top:12px}.runner-road{position:absolute;inset:0;background:linear-gradient(90deg,#445 0 18%,#8b7d73 18% 82%,#445 82%);overflow:hidden}.runner{position:absolute;bottom:18%;width:64px;height:64px;font-size:54px}.runner-ob{position:absolute;font-size:44px}.cooking-pan{position:absolute;bottom:20px;width:100%;height:120px;text-align:center;font-size:70px}.recipe{position:absolute;top:20px;left:20px}
.controls{position:absolute;z-index:7;bottom:14px;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,44px);gap:4px}.controls button{width:44px;height:44px;padding:0;border-radius:50%;font-size:17px}.controls button:nth-child(1){grid-column:2}.controls button:nth-child(2){grid-column:1}.controls button:nth-child(3){grid-column:2}.controls button:nth-child(4){grid-column:3}
@media(max-width:800px){#app{grid-template-columns:74px 1fr}#right{position:absolute;right:0;top:0;bottom:0;width:250px;z-index:18;transform:translateX(100%);transition:.2s}#right.open{transform:none}.panel:first-child{padding:8px}.logo,.sub,.cname,.role{display:none}.char-card{height:54px;padding:3px;justify-content:center}.portrait{width:48px;height:48px}.controls{display:grid}.bar{width:110px}}
</style>
</head><body>
<div id="app"><aside class="panel"><div class="logo">CRUMB<br>CHAOS</div><div class="sub">ROGUE KITCHEN</div><div class="char-list" id="chars"></div><nav><button onclick="openShop()">BLACKSMITH</button><button onclick="openSkins()">SKINS</button><button onclick="openQuest()">QUEST</button><button onclick="openRunner()">RUNNER</button><button onclick="openFood()">FOOD DROP</button><button onclick="openCook()">COOK-OFF</button></nav></aside>
<main id="game"><div class="arena" id="arena"><div class="hud"><div class="hud-box"><b id="waveName">WAVE 1</b><div class="bar"><i id="hpBar"></i></div><small id="hpText">100 / 100 HP</small></div><div class="meta"><div class="hud-box">🪙 <span class="coin" id="coins">0</span></div><div class="hud-box">💎 <span id="gems">0</span></div></div></div><div id="waveBanner" class="wave"></div><div id="player">🧙</div><div class="controls"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div></div></main>
<aside class="panel" id="right"><div id="chatHead">GLOBAL CHAT <button class="ghost" style="float:right;padding:4px" onclick="toggleChat()">×</button></div><div class="tabs"><button onclick="chatTab='global';renderChat()">GloChat</button><button onclick="chatTab='friends';renderChat()">Friends</button><button onclick="chatTab='private';renderChat()">Private</button><button onclick="chatTab='group';renderChat()">Group</button></div><div class="messages" id="messages"></div><div class="chat-input"><input id="chatText" placeholder="Say something…"><button onclick="sendChat()">SEND</button></div></aside></div>
<div id="overlay" class="overlay hidden"></div><div id="minigame" class="hidden"></div>
<script>
const $=s=>document.querySelector(s),arena=$('#arena');
const chars=[
{id:'karen',icon:'👩‍🦰',name:'Karen',role:'Roast Queen',line:'I asked for a manager in my last life.',reply:m=>/hello|hi|hey/i.test(m)?'Oh, you found the greeting. Groundbreaking.':/boss|enemy/i.test(m)?'That boss? Name a better villain. You can’t.':`Wow, “${m}” — I’ve seen sharper insults from a wet napkin.`},
{id:'dumb',icon:'🤡',name:'Dimwit',role:'Believes Everything',line:'That rock said it likes me.',reply:m=>'Oh wow, that’s totally true! I saw a bird once, so I know stuff.'},
{id:'love',icon:'💕',name:'Cupid',role:'Love Advisor',line:'Your heart needs a side quest.',reply:m=>`Here’s my advice: ${m.length>20?'be honest, but make it mysterious':'send the tiny risk, not the giant text'}.`},
{id:'dump',icon:'🗑️',name:'Dumpy',role:'Dumpster & Stress Eater',line:'Hearts are heavy. Cardboard is safe.',reply:m=>'Drag cardboard into my mouth… I’m coping.'},
{id:'coffee',icon:'☕',name:'Caffeine',role:'Hyped Coffee Cup',line:'MAXIMUM BEAN MODE!',reply:m=>'HEYYY! That’s a GREAT IDEA! I had one of those once. Maybe twice!'},
{id:'sizzle',icon:'👨‍🍳',name:'Sizzle',role:'Demon Chef',line:'Benedict, someone needs sautéing.',reply:m=>'Benedict says: crack open an opportunity, then sear it. Also, “Karen, you’re cooked.”'},
{id:'benedict',icon:'🥚',name:'Benedict',role:'Alive Fried Egg',line:'I am the yolk of your destiny.',reply:m=>'No shellshock. Just good advice: crack forward.'}
];
let selected=chars[0], coins=0,gems=0,wave=1,hp=100,maxHp=100,dead=false,chatTab='global';
const enemyTypes=['🗡️','🏹','🗡️','🧙','👑','🌀','🥷','🛡️','🔥','❄️','⚡','🌙','☀️','💘','🎄','🎸','🌿','👿','💀'];
let player={x:innerWidth>800?360:180,y:innerHeight*.55,speed:5}, enemies=[], loots=[], keys={},panAttack=false;
function renderChars(){let el=$('#chars');el.innerHTML=chars.map(c=>`<div class="char-card ${c.id===selected.id?'active':''}" onclick="selectChar('${c.id}')"><div class="portrait">${c.icon}</div><div><div class="cname">${c.name}</div><div class="role">${c.role}</div></div></div>`).join('')}
function selectChar(id){selected=chars.find(c=>c.id===id);renderChars();messages.push({name:selected.name,text:selected.line,me:false});renderChat();}
let messages=[{name:'Sizzle',text:'Welcome to Crumb & Chaos. First wave is live!',me:false},{name:'Karen',text:'Try not to embarrass the kitchen.',me:false}];
function renderChat(){const box=$('#messages');box.innerHTML=messages.map(m=>`<div class="msg ${m.me?'me':''}"><b>${m.name}</b><br>${m.text}</div>`).join('');box.scrollTop=box.scrollHeight}
function sendChat(){let input=$('#chatText'),text=input.value.trim();if(!text)return;messages.push({name:'You',text,me:true});messages.push({name:selected.name,text:selected.reply(text),me:false});input.value='';renderChat()}
$('#chatText').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});
function toggleChat(){$('#right').classList.toggle('open')}
renderChars();renderChat();
function placePlayer(){let p=$('#player');p.style.left=player.x+'px';p.style.top=player.y+'px';p.textContent=selected.icon}
placePlayer();
function spawnWave(){enemies=[];arena.querySelectorAll('.enemy').forEach(e=>e.remove());let count=4+wave*2;if(wave%5===0)count+=1;for(let i=0;i<count;i++){let boss=wave%5===0&&i===count-1;let el=document.createElement('div');el.className='enemy'+(boss?' boss':'');let type=boss?'👑':enemyTypes[(wave+i-1)%enemyTypes.length];el.textContent=type;el.dataset.hp=boss?180+wave*20:35+wave*8;el.dataset.max=el.dataset.hp;let w=arena.clientWidth,h=arena.clientHeight;el.style.left=(40+Math.random()*(w-100))+'px';el.style.top=(70+Math.random()*(h-150))+'px';arena.appendChild(el);enemies.push(el)}banner(`WAVE ${wave}`,wave%5===0?'BOSS WAVE':'New enemy class: '+(enemyTypes[(wave-1)%enemyTypes.length]))}
function banner(a,b){let el=$('#waveBanner');el.innerHTML=a+'<small>'+b+'</small';el.style.opacity=1;clearTimeout(banner.t);banner.t=setTimeout(()=>el.style.opacity=0,2200)}
spawnWave();
function bannerEnemy(){ }
function dmgText(x,y,t){let d=document.createElement('div');d.className='damage';d.style.left=x+'px';d.style.top=y+'px';d.textContent=t;arena.appendChild(d);setTimeout(()=>d.remove(),700)}
function updateHud(){ $('#hpBar').style.width=(hp/maxHp*100)+'%';$('#hpText').textContent=Math.ceil(hp)+' / '+maxHp+' HP';$('#coins').textContent=coins;$('#gems').textContent=gems}
function drop(x,y,boss=false){if(Math.random()<.01){coins+=50;loot(x,y,'P');}else{let amount=boss?20+wave*5:3+wave;coins+=amount;loot(x,y,Math.random()<.25?'🪙':amount)}if(Math.random()<.05){gems++;loot(x,y,'💎')}if(Math.random()<.015||(boss&&Math.random()<.03)){loot(x,y,'🔥 rune')}if(boss&&Math.random()<.35){loot(x,y,'🎁 Chest')}}
function loot(x,y,t){let el=document.createElement('div');el.className='loot';el.style.left=x+'px';el.style.top=y+'px';el.textContent=t==='P'?'🏆':t;arena.appendChild(el);setTimeout(()=>el.remove(),3000)}
function attack(){if(dead)return;let p=$('#player'),x=player.x,y=player.y;let fx=document.createElement('div');fx.className='projectile';fx.style.left=(x+30)+'px';fx.style.top=(y+25)+'px';arena.appendChild(fx);let angle=0;if(keys.ArrowRight||keys.d)angle=0;if(keys.ArrowLeft||keys.a)angle=Math.PI;if(keys.ArrowUp||keys.w)angle=-Math.PI/2;if(keys.ArrowDown||keys.s)angle=Math.PI/2;let vx=Math.cos(angle)*9,vy=Math.sin(angle)*9;let life=80;let timer=setInterval(()=>{let lx=parseFloat(fx.style.left)+vx,ly=parseFloat(fx.style.top)+vy;fx.style.left=lx+'px';fx.style.top=ly+'px';life--;for(let e of enemies){if(!e.isConnected)continue;let ex=parseFloat(e.style.left),ey=parseFloat(e.style.top);if(Math.abs(lx-ex)<30&&Math.abs(ly-ey)<30){let dmg=18+(panAttack?15:0);let hpv=+e.dataset.hp-dmg;e.dataset.hp=hpv;dmgText(ex,ey,'-'+dmg);fx.remove();clearInterval(timer);if(hpv<=0){let boss=e.classList.contains('boss');drop(ex,ey,boss);e.remove();enemies=enemies.filter(z=>z!==e);if(!enemies.length){if(boss)treasure();else{wave++;setTimeout(spawnWave,1200)}}}break}}if(life<=0){fx.remove();clearInterval(timer)}},16)}
window.addKey=(e)=>{keys[e]=true};addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','w','a','s','d'].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key===' ')attack()});addEventListener('keyup',e=>delete keys[e.key]);
document.querySelectorAll('.controls button').forEach(b=>b.addEventListener('touchstart',e=>{e.preventDefault();keys[b.dataset.dir]=true}));
function gameLoop(){if(!dead){if(keys.ArrowLeft||keys.a||keys.left)player.x-=player.speed;if(keys.ArrowRight||keys.d||keys.right)player.x+=player.speed;if(keys.ArrowUp||keys.w||keys.up)player.y-=player.speed;if(keys.ArrowDown||keys.s||keys.down)player.y+=player.speed;player.x=Math.max(0,Math.min(arena.clientWidth-55,player.x));player.y=Math.max(55,Math.min(arena.clientHeight-55,player.y));placePlayer();for(let e of enemies){if(!e.isConnected)continue;let ex=parseFloat(e.style.left),ey=parseFloat(e.style.top);let dx=player.x-ex,dy=player.y-ey,d=Math.hypot(dx,dy)||1;if(d<260){e.style.left=(ex+dx/d*(e.classList.contains('boss'?1:0)?1:0))+'px';e.style.top=(ey+dy/d*(e.classList.contains('boss'?1:0)?)1:0)+'px'}if(d<38){hp-=.12* (e.classList.contains('boss')?3:1);updateHud();if(hp<=0)die()}}}requestAnimationFrame(gameLoop)}gameLoop();
function die(){dead=true;let o=$('#overlay');o.classList.remove('hidden');o.innerHTML=`<div class="modal" style="text-align:center"><h2>THE KITCHEN CLAIMED YOU</h2><div class="dead-pan">🍳<span class="dead-egg">🥚</span></div><p>Tap the pan 3 times to flip Benedict!</p><button onclick="flipEgg(this)">FLIP BENEDICT</button></div>`}
let flips=0;function flipEgg(b){flips++;b.textContent='FLIP '+(3-flips);let egg=$('.dead-egg');egg.style.transform=`translate(-50%,-50%) rotate(${flips*120}deg)`;if(flips>=3){b.textContent='RETURN TO KITCHEN';b.onclick=()=>{flips=0;hp=maxHp;dead=false;$('#overlay').classList.add('hidden');updateHud()}}}
function treasure(){let o=$('#overlay');o.classList.remove('hidden');o.innerHTML=`<div class="modal"><h2>Treasure Chest!</h2><p>Choose a reward. One extra skill has a 20% chance to appear.</p><div class="shop-grid"><div class="item"><b>⚔️ Flameblade Lv. ${wave}</b><button onclick="closeOverlay()">EQUIP</button></div><div class="item"><b>🛡️ Frost Armor Lv. ${wave}</b><button onclick="closeOverlay()">EQUIP</button></div><div class="item"><b>🪙 ${120+wave*30} Coins</b><button onclick="coins+=${120+wave*30};updateHud();closeOverlay()">CLAIM</button></div>${Math.random()<.2?'<div class="item"><b>✨ Pick Two Skill</b><button onclick="closeOverlay()">LEARN</button></div>':''}</div></div>`}
function closeOverlay(){ $('#overlay').classList.add('hidden') }
function openShop(){let o=$('#overlay');o.classList.remove('hidden');o.innerHTML=`<div class="modal"><h2>Rune Smith & Blacksmith</h2><p>Embed elemental stones to change weapon effects.</p><div class="shop-grid"><div class="item"><b>🔥 Fire Rune Lv.1</b><small>Burn on hit</small><button onclick="coins>=20?(coins-=20,updateHud(),alert('Fire Rune equipped')):alert('Need 20 coins')">20 🪙</button></div><div class="item"><b>❄️ Ice Rune Lv.1</b><small>Chill enemies</small><button onclick="coins>=25?(coins-=25,updateHud(),alert('Ice Rune equipped')):alert('Need 25 coins')">25 🪙</button></div><div class="item"><b>🍳 Frying Pan Lv.${wave}</b><small>Hitting enemies says “Karen, you’re cooked!”</small><button onclick="coins>=40?(coins-=40,panAttack=true,updateHud(),alert('Karen, you’re cooked!')):alert('Need 40 coins')">40 🪙</button></div><div class="item"><b>🎭 Rift Guitar Lv.1</b><small>Shockwave attacks</small><button onclick="coins>=60?(coins-=60,updateHud(),alert('Guitar equipped')):alert('Need 60 coins')">60 🪙</button></div></div><br><button onclick="closeOverlay()">CLOSE</button></div>`}
function openSkins(){let o=$('#overlay');o.classList.remove('hidden');o.innerHTML=`<div class="modal"><h2>Limited Edition Skin Shop</h2><div class="shop-grid"><div class="item"><b>Common: Kitchen Apron</b><button onclick="closeOverlay()">Owned</button></div><div class="item"><b>Rare: Neon Chef</b><button onclick="coins>=75?(coins-=75,updateHud(),closeOverlay()):alert('Need 75 coins')">75 🪙</button></div><div class="item"><b>Mythic: Galaxy Yolk</b><button onclick="coins>=300?(coins-=300,updateHud(),closeOverlay()):alert('Need 300 coins')">300 🪙</button></div><div class="item"><b>Godlike: Chaos Cupid</b><button onclick="gems>=10?(gems-=10,updateHud(),closeOverlay()):alert('Need 10 gems')">10 💎</button></div></div><br><button onclick="closeOverlay()">CLOSE</button></div>`}
function openQuest(){let o=$('#overlay');o.classList.remove('hidden');o.innerHTML=`<div class="modal"><h2>Daily Quests</h2><div class="item">Defeat 10 enemies <b>${Math.min(wave*2,10)} / 10</b></div><div class="item">Collect 50 coins <b>${coins>=50?'Complete':coins+' / 50'}</b></div><div class="item">Talk to every character <b>Progress: ${messages.length>5?'3':'1'} / 7</b></div><br><button onclick="closeOverlay()">CLOSE</button></div>`}
function openRunner(){let m=$('#minigame');m.className='';m.innerHTML=`<div class="runner-road"></div><div class="mini-hud">RUNNER • <span id="runScore">0</span>m</div><div class="runner" id="runner">${selected.icon}</div><button class="ghost" style="position:absolute;right:12px;top:12px;z-index:3" onclick="closeMini()">EXIT</button>`;let r=$('#runner'),road=m.querySelector('.runner-road'),lane=1,score=0,live=true;r.style.left='34%';r.style.bottom='18%';let move=e=>{if(e.key==='ArrowLeft'||e.key==='a')lane=Math.max(0,lane-1);if(e.key==='ArrowRight'||e.key==='d')lane=Math.min(2,lane+1);r.style.left=(20+lane*30)+'%'};addEventListener('keydown',move);let timer=setInterval(()=>{score+=1;$(`#runScore`).textContent=score;let ob=document.createElement('div');ob.className='runner-ob';ob.textContent=['🚧','🍩','🪨'][Math.floor(Math.random()*3)];let l=Math.floor(Math.random()*3);ob.style.left=(20+l*30)+'%';ob.style.top='-60px';road.appendChild(ob);let y=-60,t=setInterval(()=>{y+=5;ob.style.top=y+'px';if(y>road.clientHeight*.72&&l===lane&&ob.textContent!=='🍩'){clearInterval(t);closeMini();banner('BONK!','Runner ended') }if(y>road.clientHeight){clearInterval(t);ob.remove()}},30);setTimeout(()=>clearInterval(t),12000)},700);m.dataset.timer=timer;m.dataset.move=move}
function openFood(){let m=$('#minigame');m.className='';m.innerHTML=`<div class="mini-hud">FOOD CATCH • Misses: <span id="misses">0</span>/3 • <span id="foodScore">0</span> 🪙</div><div class="coffee">☕</div><div class="dumpster" id="dumpster">🗑️</div><button class="ghost" style="position:absolute;right:12px;top:12px;z-index:3" onclick="closeMini()">EXIT</button>`;let misses=0,score=0,live=true,d=$('#dumpster'),pos=50;addEventListener('mousemove',e=>{if(live)pos=e.clientX/m.clientWidth*100});function touchmove(e){if(live){pos=e.touches[0].clientX/m.clientWidth*100}}m.addEventListener('touchmove',touchmove);let timer=setInterval(()=>{let f=document.createElement('div');f.className='drop-food';f.textContent=['🍕','🥐','🍩','🍎','📦'][Math.floor(Math.random()*5)];f.style.left=(10+Math.random()*80)+'%';f.style.top='-50px';m.appendChild(f);let y=-50,t=setInterval(()=>{y+=4;f.style.top=y+'px';d.style.left=pos+'%';if(y>m.clientHeight-120&&Math.abs(parseFloat(f.style.left)-pos)<14){score+=5;$('#foodScore').textContent=score;clearInterval(t);f.remove()}if(y>m.clientHeight){clearInterval(t);f.remove();misses++;$('#misses').textContent=misses;if(misses>=3){coins+=score;updateHud();clearInterval(timer);live=false;banner('FULL PANTRY','Coins banked: '+score);setTimeout(closeMini,900)}}},25)},650);m.dataset.timer=timer;m.dataset.live=()=>live=false}
function openCook(){let m=$('#minigame');m.className='';m.innerHTML=`<div class="recipe"><b>COOK-OFF: SIZZLE VS. TIME</b><p id="cookTask">Tap the pan when it sparks!</p></div><div class="cooking-pan" id="cookPan">🍳</div><div class="mini-hud" style="top:auto;bottom:145px">Score: <span id="cookScore">0</span></div><button class="ghost" style="position:absolute;right:12px;top:12px;z-index:3" onclick="closeMini()">EXIT</button>`;let score=0;let pan=$('#cookPan');pan.onclick=()=>{let ok=Math.random()<.55;if(ok){score+=10;$('#cookScore').textContent=score;pan.textContent='✨🍳✨'}else pan.textContent='🍳💨';setTimeout(()=>pan.textContent='🍳',300)};let timer=setInterval(()=>{pan.textContent=Math.random()<.5?'🍳⚡':'🍳'},900);m.dataset.timer=timer}
function closeMini(){let m=$('#minigame');if(m.dataset.timer)clearInterval(+m.dataset.timer);if(m.dataset.move){ }m.className='hidden';m.innerHTML='' }
</script></body></html>
